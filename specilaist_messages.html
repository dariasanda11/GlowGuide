<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Messages - GLOWGUIDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Client Messages</h1>
            <a href="specialist_dashboard.html" class="text-pink-600 hover:text-pink-700 font-medium flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Dashboard
            </a>
        </div>

        <div id="messages-container" class="space-y-4">
            <div class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-600"></div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('messages-container');

        // 1. FUNCȚIA DE RENTARE (Cum arată un mesaj în HTML)
        function createMessageHTML(msg) {
            const statusBadge = msg.replied 
                ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">Replied</span>`
                : `<span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm font-medium">Pending</span>`;

            return `
                <a href="message_detail.html?id=${msg.id}" class="block bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition-all border border-transparent hover:border-pink-200">
                    <div class="flex flex-col md:flex-row md:items-start justify-between mb-4 gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center">
                                <svg class="w-6 h-6 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-width="2"></path></svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">${msg.clientName}</h3>
                                <p class="text-sm text-gray-600">${msg.clientEmail}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="text-sm text-gray-500">${msg.date}</span>
                            ${statusBadge}
                        </div>
                    </div>
                    <h4 class="font-medium mb-1">Subject: ${msg.subject}</h4>
                    <p class="text-gray-600 line-clamp-2 text-sm">${msg.message}</p>
                </a>
            `;
        }

        // 2. FUNCȚIA DE FETCH (Aici vei face legătura cu baza de date)
        async function loadMessagesFromDB() {
            try {
                // Aici vei înlocui cu codul tău de Firebase/Supabase/Fetch
                // Exemplu: const { data: messages, error } = await supabase.from('messages').select('*');
                
                const messages = []; // Momentan este gol, deci va afișa "No messages"

                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 bg-white rounded-xl shadow-sm border border-dashed border-gray-300">
                            <h3 class="text-lg font-medium text-gray-900">No messages yet</h3>
                            <p class="text-gray-500">When clients contact you, their messages will appear here.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = messages.map(msg => createMessageHTML(msg)).join('');
                }

            } catch (error) {
                console.error("Eroare la încărcarea datelor:", error);
                container.innerHTML = `<p class="text-red-500 text-center">A apărut o eroare la încărcarea mesajelor.</p>`;
            }
        }

        // Pornim procesul de încărcare
        loadMessagesFromDB();
    </script>
</body>
</html>
