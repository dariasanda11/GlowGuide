<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Skin Concern</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="form-container" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold mb-2">Upload Skin Concern</h1>
            <p class="text-gray-600">Share photos and details about your skin concerns</p>
        </div>

        <form id="concern-form" class="bg-white rounded-2xl shadow-lg p-8">
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Concern Type</label>
                <select id="concern" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent" required>
                    <option value="">Select a concern</option>
                    <option value="acne">Acne</option>
                    <option value="dryness">Dry Skin</option>
                    <option value="oiliness">Oily Skin</option>
                    <option value="dark-spots">Dark Spots / Hyperpigmentation</option>
                    <option value="wrinkles">Fine Lines / Wrinkles</option>
                    <option value="redness">Redness / Sensitivity</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Upload Photos</label>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-purple-400 transition-colors relative">
                    <input type="file" id="image-upload" class="hidden" accept="image/*" multiple>
                    <label htmlFor="image-upload" for="image-upload" class="cursor-pointer block">
                        <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        <p class="text-gray-600 mb-2">Click to upload photos</p>
                        <p class="text-sm text-gray-500">or drag and drop</p>
                        <p class="text-xs text-gray-400 mt-2">PNG, JPG up to 10MB</p>
                    </label>
                </div>
                <div id="image-preview" class="grid grid-cols-3 gap-4 mt-4"></div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Description</label>
                <textarea id="message" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent" rows="6" placeholder="Describe your skin concern in detail..." required></textarea>
            </div>

            <div class="flex gap-4">
                <button type="button" onclick="window.history.back()" class="flex-1 border-2 border-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                    Cancel
                </button>
                <button type="submit" class="flex-1 bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition-colors font-medium">
                    Submit for Review
                </button>
            </div>
        </form>
    </div>

    <div id="success-message" class="hidden max-w-2xl mx-auto px-4 py-16 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h2 class="text-3xl font-bold mb-4">Consultation Submitted!</h2>
        <p class="text-gray-600 mb-2">Thank you for submitting your skin concern.</p>
        <p class="text-sm text-gray-500">Redirecting to dashboard...</p>
    </div>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const imagePreview = document.getElementById('image-preview');
        const form = document.getElementById('concern-form');
        const formContainer = document.getElementById('form-container');
        const successMessage = document.getElementById('success-message');

        let selectedFiles = [];

        // Gestionare Upload Imagini
        imageUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...files];
            renderPreviews();
        });

        function renderPreviews() {
            imagePreview.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative group';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-32 object-cover rounded-lg">
                        <button type="button" onclick="removeImage(${index})" class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    `;
                    imagePreview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeImage = (index) => {
            selectedFiles.splice(index, 1);
            renderPreviews();
        };

        // Trimitere Formular
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Aici s-ar face apelul API în mod normal
            formContainer.classList.add('hidden');
            successMessage.classList.remove('hidden');

            setTimeout(() => {
                alert('Redirecționare către dashboard...');
                // window.location.href = '/client/dashboard'; 
            }, 2000);
        });
    </script>
</body>
</html>
