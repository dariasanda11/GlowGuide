<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">Order History</h1>
        <a href="/client/client_dashboard.html" class="text-purple-600 hover:text-purple-700 font-medium flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Dashboard
        </a>
    </div>

    <div id="orders-container" class="space-y-6">
        <div class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    const myEmail = localStorage.getItem('loggedClientEmail');
    const container = document.getElementById('orders-container');

    async function loadOrderHistory() {

        if (!myEmail) {
            container.innerHTML = `<p class="text-red-500 text-center py-10 font-bold">Please log in to view your order history.</p>`;
            return;
        }

        try {

            const response = await fetch(`/api/orders/${myEmail}`);
            if (response.ok) {
                const orders = await response.json();

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 bg-white rounded-xl shadow-sm border border-gray-100">
                            <i data-lucide="package" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                            <h3 class="text-xl font-bold text-gray-700 mb-2">No orders yet</h3>
                            <p class="text-gray-500 mb-6">When you complete a purchase, your receipt will appear here.</p>
                            <a href="/client/client_recommendations.html" class="inline-block bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 font-medium">Browse Products</a>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = orders.map(order => `
                    <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100 hover:shadow-lg transition-shadow">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <i data-lucide="package" class="w-5 h-5 text-purple-600"></i>
                                    <h3 class="font-bold text-lg">Order #GLOW-${order.id}</h3>
                                </div>
                                <div class="flex items-center gap-2 text-sm text-gray-600">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                    <span>${order.orderDate}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold mb-1">$${order.totalAmount.toFixed(2)}</div>
                                <span class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                                    Completed
                                </span>
                            </div>
                        </div>

                        <div class="border-t pt-4">
                            <h4 class="font-medium mb-3">Items</h4>
                            <div class="space-y-2">
                                ${order.items.map(item => `
                                    <div class="flex justify-between text-sm">
                                        <span class="text-gray-600">${item.name} × ${item.quantity}</span>
                                        <span class="font-medium">$${(item.price * item.quantity).toFixed(2)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');

                lucide.createIcons();
            }
        } catch (error) {
            console.error("Error fetching orders:", error);
            container.innerHTML = `<p class="text-red-500 text-center py-10">Failed to connect to the database.</p>`;
        }
    }

    loadOrderHistory();
</script>
</body>
</html>
