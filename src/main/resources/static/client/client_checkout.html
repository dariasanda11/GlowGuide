<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - GlowGuide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen">

<div id="checkout-view" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">Checkout</h1>
        <a href="/client/client_cart.html" class="text-purple-600 hover:text-purple-700 font-medium flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Cart
        </a>
    </div>

    <div class="grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2">
            <form id="checkout-form" class="space-y-6">
                <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
                    <h2 class="text-xl font-bold mb-4">Shipping Information</h2>
                    <div class="grid md:grid-cols-2 gap-4">
                        <input type="text" placeholder="First Name" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        <input type="text" placeholder="Last Name" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        <input type="email" placeholder="Email" id="checkout-email" class="md:col-span-2 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        <input type="text" placeholder="Address" class="md:col-span-2 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        <input type="text" placeholder="City" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        <input type="text" placeholder="ZIP Code" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i data-lucide="credit-card" class="w-5 h-5 text-gray-500"></i>
                        Payment Information
                    </h2>
                    <div class="space-y-4">
                        <input type="text" placeholder="Card Number" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" placeholder="MM/YY" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                            <input type="text" placeholder="CVV" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-purple-600 text-white py-4 rounded-lg hover:bg-purple-700 transition-colors font-bold text-lg shadow-md flex justify-center items-center gap-2">
                    Complete Purchase
                </button>
            </form>
        </div>

        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl shadow-md p-6 sticky top-4 border border-gray-100">
                <h2 class="text-xl font-bold mb-4">Order Summary</h2>

                <div id="summary-items" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
                    <p class="text-sm text-gray-500 italic">Loading cart items...</p>
                </div>

                <div class="border-t border-gray-200 pt-4 space-y-3">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Subtotal</span>
                        <span class="font-medium" id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Shipping</span>
                        <span class="font-medium text-green-600">Free</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Tax (8%)</span>
                        <span class="font-medium" id="summary-tax">$0.00</span>
                    </div>
                </div>
                <div class="border-t border-gray-200 pt-4 mt-4 flex justify-between">
                    <span class="font-bold text-lg">Total</span>
                    <span class="font-bold text-2xl text-purple-700" id="summary-total">$0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="success-view" class="max-w-2xl mx-auto px-4 py-24 text-center hidden animate-fade-in">
    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm">
        <i data-lucide="check" class="w-12 h-12 text-green-600"></i>
    </div>
    <h2 class="text-4xl font-bold mb-4 text-gray-900">Order Confirmed!</h2>
    <p class="text-lg text-gray-600 mb-8 max-w-md mx-auto">
        Thank you for your purchase. Your order has been confirmed and will be shipped soon.
    </p>
    <div class="flex items-center justify-center gap-3 text-sm text-gray-500 bg-gray-100 py-3 px-6 rounded-full w-fit mx-auto">
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-gray-500"></div>
        Redirecting to dashboard...
    </div>
</div>

<script>
    lucide.createIcons();

    const myEmail = localStorage.getItem('loggedClientEmail');
    let cartItems = [];

    const checkoutView = document.getElementById('checkout-view');
    const successView = document.getElementById('success-view');
    const checkoutForm = document.getElementById('checkout-form');
    const summaryItemsContainer = document.getElementById('summary-items');

    if (myEmail) {
        document.getElementById('checkout-email').value = myEmail;
    }

    async function loadCartSummary() {
        if (!myEmail) {
            summaryItemsContainer.innerHTML = '<p class="text-red-500 text-sm">Please log in to view summary.</p>';
            return;
        }

        try {
            const response = await fetch(`/api/cart/${myEmail}`);
            if (response.ok) {
                cartItems = await response.json();
                renderSummary();
            }
        } catch (error) {
            console.error("Failed to load cart for checkout", error);
        }
    }

    function renderSummary() {
        if (cartItems.length === 0) {
            summaryItemsContainer.innerHTML = '<p class="text-gray-500 text-sm italic">Your cart is empty.</p>';
            return;
        }

        let subtotal = 0;
        let itemsHtml = '';

        cartItems.forEach(item => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;

            itemsHtml += `
                <div class="flex justify-between text-sm items-center py-1">
                    <span class="text-gray-700 flex-1 pr-4 line-clamp-1">${item.name} × ${item.quantity}</span>
                    <span class="font-medium whitespace-nowrap">$${itemTotal.toFixed(2)}</span>
                </div>
            `;
        });

        summaryItemsContainer.innerHTML = itemsHtml;

        const tax = subtotal * 0.08;
        const total = subtotal + tax;

        document.getElementById('summary-subtotal').innerText = `$${subtotal.toFixed(2)}`;
        document.getElementById('summary-tax').innerText = `$${tax.toFixed(2)}`;
        document.getElementById('summary-total').innerText = `$${total.toFixed(2)}`;
    }

        checkoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!myEmail || cartItems.length === 0) return;

            let subtotal = 0;
            cartItems.forEach(item => subtotal += (item.price * item.quantity));
            const totalWithTax = subtotal + (subtotal * 0.08);

            const orderPayload = {
                clientEmail: myEmail,
                totalAmount: totalWithTax,
                items: cartItems.map(item => ({
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity,
                    image: item.image
                }))
            };

            try {

                const orderRes = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                if (orderRes.ok) {

                    for (const item of cartItems) {
                        await fetch(`/api/cart/${item.id}`, { method: 'DELETE' });
                    }

                    checkoutView.classList.add('hidden');
                    successView.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = '/client/client_purchasehistory.html';
                    }, 3000);
                }
            } catch (error) {
                console.error("Checkout failed:", error);
                alert("Failed to process order.");
            }
        });

    loadCartSummary();
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
    }
</style>
</body>
</html>
