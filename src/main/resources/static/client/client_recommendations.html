<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold mb-2">Recommended Products</h1>
            <p class="text-gray-600">Products curated for your skin type and concerns</p>
        </div>
        <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200">
            <span class="text-purple-600 font-bold">Cart: <span id="cart-count">0</span> items</span>
        </div>
    </div>

    <div id="products-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
</div>

<script>
    // Date de test (Mock Data)
    const mockProducts = [
        {
            id: '1',
            brand: 'Glow Essentials',
            name: 'Vitamin C Serum',
            description: 'Brightens and evens skin tone with potent antioxidants.',
            price: 29.99,
            image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&q=80&w=400'
        },
        {
            id: '2',
            brand: 'HydraPure',
            name: 'Hyaluronic Acid Gel',
            description: 'Deep hydration for a plump, healthy-looking complexion.',
            price: 24.50,
            image: 'https://images.unsplash.com/photo-1556228578-0d85b1a4d571?auto=format&fit=crop&q=80&w=400'
        },
        {
            id: '3',
            brand: 'PureCare',
            name: 'Gentle Foaming Cleanser',
            description: 'Removes impurities without stripping natural oils.',
            price: 18.00,
            image: 'https://images.unsplash.com/photo-1556228578-8fd7c1264a8a?auto=format&fit=crop&q=80&w=400'
        }
    ];

    // Starea aplicației (State)
    let cartItems = [];
    let addedFeedbackSet = new Set(); // Pentru efectul vizual de "Added"

    const productsGrid = document.getElementById('products-grid');
    const cartCountDisplay = document.getElementById('cart-count');

    // Funcția de randare a produselor
    function renderProducts() {
        productsGrid.innerHTML = '';

        mockProducts.forEach(product => {
            const isRecentlyAdded = addedFeedbackSet.has(product.id);
            const alreadyInCart = cartItems.some(item => item.id === product.id);

            // Determinăm stilul butonului în funcție de stare
            let buttonClass = "";
            let buttonContent = "";

            if (isRecentlyAdded) {
                buttonClass = "bg-green-600 text-white cursor-default";
                buttonContent = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Added`;
            } else if (alreadyInCart) {
                buttonClass = "bg-purple-100 text-purple-600 hover:bg-purple-200";
                buttonContent = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> Add More`;
            } else {
                buttonClass = "bg-purple-600 text-white hover:bg-purple-700";
                buttonContent = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> Add to Cart`;
            }

            const productCard = `
                <div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow overflow-hidden">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-64 object-cover">
                    <div class="p-6">
                        <div class="text-sm text-purple-600 font-medium mb-1">${product.brand}</div>
                        <h3 class="font-bold text-lg mb-2">${product.name}</h3>
                        <p class="text-gray-600 text-sm mb-4">${product.description}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl font-bold">$${product.price.toFixed(2)}</span>
                            <button
                                onclick="handleAddToCart('${product.id}')"
                                ${isRecentlyAdded ? 'disabled' : ''}
                                class="flex items-center px-4 py-2 rounded-lg font-medium transition-colors ${buttonClass}"
                            >
                                ${buttonContent}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            productsGrid.innerHTML += productCard;
        });
    }

    // Logica pentru Adăugare în Coș
    window.handleAddToCart = (productId) => {
        const product = mockProducts.find(p => p.id === productId);

        // Adăugăm în coș
        cartItems.push(product);
        cartCountDisplay.innerText = cartItems.length;

        // Feedback vizual (SetTimeout)
        addedFeedbackSet.add(productId);
        renderProducts();

        setTimeout(() => {
            addedFeedbackSet.delete(productId);
            renderProducts();
        }, 2000);
    };

    // Randare inițială
    renderProducts();
</script>
</body>
</html>
