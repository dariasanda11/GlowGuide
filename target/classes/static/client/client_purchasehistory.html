<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold mb-8">Order History</h1>

    <div class="space-y-6">

        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="package" class="w-5 h-5 text-purple-600"></i>
                        <h3 class="font-bold text-lg">Order #ORD-7721</h3>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span>May 15, 2026</span>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-2xl font-bold mb-1">$53.56</div>
                    <span class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                            Delivered
                        </span>
                </div>
            </div>

            <div class="border-t pt-4">
                <h4 class="font-medium mb-3">Items</h4>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Hydrating Facial Serum × 1</span>
                        <span class="font-medium">$45.00</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Tax × 1</span>
                        <span class="font-medium">$8.56</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="package" class="w-5 h-5 text-purple-600"></i>
                        <h3 class="font-bold text-lg">Order #ORD-6540</h3>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span>April 22, 2026</span>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-2xl font-bold mb-1">$120.00</div>
                    <span class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                            Delivered
                        </span>
                </div>
            </div>

            <div class="border-t pt-4">
                <h4 class="font-medium mb-3">Items</h4>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Retinol Night Cream × 1</span>
                        <span class="font-medium">$85.00</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Cleansing Balm × 1</span>
                        <span class="font-medium">$35.00</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
