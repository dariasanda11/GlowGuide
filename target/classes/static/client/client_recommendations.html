<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
    <div>
        <h1 class="text-3xl font-bold mb-2">Recommended Products</h1>
        <p class="text-gray-600">Products curated for your skin type and concerns</p>
    </div>

    <div class="flex items-center gap-4">
        <a href="/client/client_dashboard.html" class="text-purple-600 hover:text-purple-700 font-medium flex items-center gap-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>

        <a href="/client/client_cart.html" class="block bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-purple-300 hover:shadow-md hover:bg-purple-50 transition-all cursor-pointer">
            <span class="text-purple-600 font-bold">Cart: <span id="cart-count">0</span> items</span>
        </a>
    </div>
</div>

    <div id="products-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
</div>

<script>

    const myEmail = localStorage.getItem('loggedClientEmail');

    let allProducts = [];
    let cartItems = [];
    let addedFeedbackSet = new Set();

    const productsGrid = document.getElementById('products-grid');
    const cartCountDisplay = document.getElementById('cart-count');

    async function loadData() {
        try {

            const productRes = await fetch('/api/products');
            if (productRes.ok) {
                allProducts = await productRes.json();
            }

            if (myEmail) {
                const cartRes = await fetch(`/api/cart/${myEmail}`);
                if (cartRes.ok) {
                    cartItems = await cartRes.json();


                    let totalCount = 0;
                    cartItems.forEach(item => totalCount += item.quantity);
                    cartCountDisplay.innerText = totalCount;
                }
            }


            renderProducts();

        } catch (error) {
            console.error("Error connecting to database:", error);
            productsGrid.innerHTML = `<p class="text-red-500 col-span-full text-center">Failed to load products from database. Is Spring Boot running?</p>`;
        }
    }


    function renderProducts() {
        productsGrid.innerHTML = '';

        if (allProducts.length === 0) {
            productsGrid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No products available yet. Check back soon!</p>`;
            return;
        }

        allProducts.forEach(product => {
            const isRecentlyAdded = addedFeedbackSet.has(product.id);

            const alreadyInCart = cartItems.some(item => item.name === product.name);

            let buttonClass = "";
            let buttonContent = "";

            if (isRecentlyAdded) {
                buttonClass = "bg-green-600 text-white cursor-default";
                buttonContent = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Added`;
            } else if (alreadyInCart) {
                buttonClass = "bg-purple-100 text-purple-600 hover:bg-purple-200";
                buttonContent = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> Add More`;
            } else {
                buttonClass = "bg-purple-600 text-white hover:bg-purple-700";
                buttonContent = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> Add to Cart`;
            }

            const productCard = `
                <div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow overflow-hidden flex flex-col">
                    <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-64 object-cover">
                    <div class="p-6 flex flex-col flex-1">
                        <div class="text-sm text-purple-600 font-medium mb-1">${product.brand}</div>
                        <h3 class="font-bold text-lg mb-2">${product.name}</h3>
                        <p class="text-gray-600 text-sm mb-4 flex-1">${product.description}</p>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-2xl font-bold">$${product.price.toFixed(2)}</span>
                            <button
                                onclick="handleAddToCart(${product.id})"
                                ${isRecentlyAdded ? 'disabled' : ''}
                                class="flex items-center px-4 py-2 rounded-lg font-medium transition-colors ${buttonClass}"
                            >
                                ${buttonContent}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            productsGrid.innerHTML += productCard;
        });
    }

    window.handleAddToCart = async (productId) => {
        if (!myEmail) {
            alert("Please log in to add items to your cart!");
            return;
        }

        const product = allProducts.find(p => p.id === productId);

        const cartItemData = {
            clientEmail: myEmail,
            brand: product.brand,
            name: product.name,
            price: product.price,
            quantity: 1,
            image: product.imageUrl
        };

        try {

            const response = await fetch('/api/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cartItemData)
            });

            if (response.ok) {

                addedFeedbackSet.add(productId);

                await loadData();

                setTimeout(() => {
                    addedFeedbackSet.delete(productId);
                    renderProducts();
                }, 2000);
            } else {
                alert("Failed to add product to cart.");
            }
        } catch (error) {
            console.error("Cart error:", error);
        }
    };

    loadData();
</script>
</body>
</html>
