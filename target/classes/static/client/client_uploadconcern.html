<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Skin Concern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

<div id="upload-view" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold mb-2">Upload Skin Concern</h1>
        <p class="text-gray-600">Share photos and details about your skin concerns</p>
    </div>

    <form id="concern-form" class="bg-white rounded-2xl shadow-lg p-8">
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Concern Type</label>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2 text-gray-700">Choose a Specialist</label>
                <select id="specialist-select" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 outline-none bg-white" required>
                    <option value="" disabled selected>Loading specialists...</option>
                </select>
            </div>
            <select id="subject" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none" required>
                <option value="">Select a concern</option>
                <option value="acne">Acne</option>
                <option value="dryness">Dry Skin</option>
                <option value="oiliness">Oily Skin</option>
                <option value="dark-spots">Dark Spots / Hyperpigmentation</option>
                <option value="wrinkles">Fine Lines / Wrinkles</option>
                <option value="redness">Redness / Sensitivity</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Upload Photos</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-purple-400 transition-colors relative">
                <input type="file" id="image-upload" class="hidden" accept="image/*" multiple />
                <label htmlFor="image-upload" class="cursor-pointer block" onclick="document.getElementById('image-upload').click()">
                    <i data-lucide="upload" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
                    <p class="text-gray-600 mb-2">Click to upload photos</p>
                    <p class="text-sm text-gray-500">or drag and drop</p>
                    <p class="text-xs text-gray-400 mt-2">PNG, JPG up to 10MB</p>
                </label>
            </div>

            <div id="image-preview-grid" class="grid grid-cols-3 gap-4 mt-4 hidden">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Description</label>
            <textarea
                    id="message"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none"
                    rows="6"
                    placeholder="Describe your skin concern in detail. When did it start? What have you tried?"
                    required
            ></textarea>
        </div>

        <div class="flex gap-4">
            <button type="button" onclick="window.location.href='/client/client_dashboard.html'" class="flex-1 border-2 border-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                Cancel
            </button>
            <button type="submit" class="flex-1 bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition-colors font-medium shadow-md">
                Submit for Review
            </button>
        </div>
    </form>
</div>

<div id="success-view" class="hidden max-w-2xl mx-auto px-4 py-16 text-center">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-lucide="check" class="w-10 h-10 text-green-600"></i>
    </div>
    <h2 class="text-3xl font-bold mb-4">Consultation Submitted!</h2>
    <p class="text-gray-600 mb-2">
        Thank you for submitting your skin concern. Our specialists will review your case soon.
    </p>
    <p class="text-sm text-gray-500 animate-pulse">Redirecting to dashboard...</p>
</div>

<script>
    lucide.createIcons();

    const fileInput = document.getElementById('image-upload');
    const previewGrid = document.getElementById('image-preview-grid');
    const form = document.getElementById('concern-form');
    const uploadView = document.getElementById('upload-view');
    const successView = document.getElementById('success-view');
    const specialistSelect = document.getElementById('specialist-select');

    const getBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    async function loadSpecialists() {
        try {
            const response = await fetch('/api/auth/specialists');
            if (response.ok) {
                const specialists = await response.json();
                specialistSelect.innerHTML = '<option value="" disabled selected>Select a specialist</option>';
                specialists.forEach(spec => {
                    specialistSelect.innerHTML += `<option value="${spec.email}">${spec.name}</option>`;
                });
            } else {
                specialistSelect.innerHTML = '<option value="" disabled selected>Failed to load specialists</option>';
            }
        } catch (error) {
            specialistSelect.innerHTML = '<option value="" disabled selected>Connection error</option>';
        }
    }

    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            previewGrid.classList.remove('hidden');
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const div = document.createElement('div');
                    div.className = 'relative group';
                    div.innerHTML = `
                        <img src="${event.target.result}" class="w-full h-32 object-cover rounded-lg">
                        <button type="button" class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 opacity-90 hover:opacity-100" onclick="this.parentElement.remove()">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    `;
                    previewGrid.appendChild(div);
                    lucide.createIcons();
                };
                reader.readAsDataURL(file);
            });
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const subjectValue = document.getElementById('subject').value;
        const messageValue = document.getElementById('message').value;
        const selectedSpecialistEmail = specialistSelect.value;
        const realName = localStorage.getItem('loggedClientName') || "Unknown";
        const realEmail = localStorage.getItem('loggedClientEmail') || "unknown@email.com";

        const base64Images = await Promise.all(Array.from(fileInput.files).map(getBase64));

        const concernData = {
            clientName: realName,
            clientEmail: realEmail,
            specialistEmail: selectedSpecialistEmail,
            subject: subjectValue,
            message: messageValue,
            images: base64Images
        };

        try {
            const response = await fetch('/api/concerns', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(concernData)
            });

            if (response.ok) {
                uploadView.classList.add('hidden');
                successView.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/client/client_dashboard.html';
                }, 2000);
            } else {
                alert('Server error processing request');
            }
        } catch (error) {
            alert('Database connection failed');
        }
    });

    loadSpecialists();
</script>
</body>
</html>
